(async()=>{try{const r=await fetch('./index-v5-nfl-test.html',{cache:'no-store'});if(!r.ok)throw Error('Dashboard HTTP '+r.status);let page=await r.text();const extension="\n\u003cscript>\n(function(){\nconst prevSources=v5Sources;\nlet rows=[],readState=\"Not loaded\",checked=\"\",error=\"\",prior=null,onlyConcerns=false,reportDates=[],searchName=\"\";\nfunction freshness(){\n if(!checked)return 'No NFL check completed yet.';\n const age=Date.now()-Date.parse(checked);\n if(!Number.isFinite(age))return 'Check time unavailable; NFL report date unverified.';\n const hours=Math.max(0,Math.floor(age/3600000));\n return (hours>=24?'\u26a0\ufe0f Last fetch is '+hours+' hours old. Recheck before lineup decisions.':hours>=2?'Last fetch '+hours+' hours ago. Recheck near kickoff.':'Recently fetched on this device.')+' This is NOT the NFL publication time.';\n}\nfunction sourceDate(table){\n // Only accept a complete explicit month/day/year, never infer it from retrieval time.\n const area=table?.parentElement?.parentElement;\n const heading=[...((area&&area.querySelectorAll('h1,h2,h3,h4,caption'))||[])].map(x=>x.textContent.trim()).join(' ');\n const match=heading.match(/\\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\\s+\\d{1,2},?\\s+20\\d{2}\\b/i);\n return match?match[0]:'';\n}\nconst KEY54=\"kuppcheck-v54-nfl-snapshot\";\ntry {prior=JSON.parse(localStorage.getItem(KEY54)||\"null\")}catch(e){}\nconst norm=s=>String(s||\"\").toLowerCase().replace(/\\b(jr|sr|ii|iii|iv)\\b\\.?/g,\"\").replace(/[^a-z0-9]/g,\"\");\nconst valid=s=>s&&s.trim()&&s.trim()!==\"-\"&&s.trim().toLowerCase()!==\"unspecified\";\nfunction concern(r){\n const d=(r.designation||\"\").toLowerCase(),p=(r.practice||\"\").toLowerCase();\n if(/\\b(out|doubtful|questionable)\\b/.test(d))return {level:\"Game designation\",important:true};\n if(/did not participate|dnp|limited participation|limited practice/.test(p))return {level:\"Practice limitation\",important:true};\n if(/full participation|full practice/.test(p))return {level:\"Full practice\",important:false};\n return {level:\"Needs review\",important:false};\n}\nfunction priority(r){const d=(r.designation||'').toLowerCase(),p=(r.practice||'').toLowerCase();if(/\\bout\\b/.test(d))return 5;if(/\\bdoubtful\\b/.test(d))return 4;if(/\\bquestionable\\b/.test(d))return 3;if(/did not participate|dnp/.test(p))return 2;if(/limited participation|limited practice/.test(p))return 1;return 0;}\nfunction dateAudit(){\n const verified=reportDates.length;\n const age=checked?Math.max(0,Math.floor((Date.now()-Date.parse(checked))/60000)):null;\n const status=age===null?'NOT CHECKED':age>=120?'RECHECK ADVISED':'RECENTLY FETCHED';\n const color=age===null?'#c4cbd8':age>=120?'#ff707a':'#5be29b';\n const dateInfo=verified?'Found '+verified+' date label(s) near NFL tables (context only)':'No complete dates verified near NFL tables';\n return '\u003csection style=\"padding:13px;border:1px solid #64748b;border-radius:10px;margin:12px 0;background:#101b2b\">\u003cstrong>\ud83d\udd0e Seventh-grade source audit\u003c/strong>\u003cp style=\"margin:8px 0;color:'+color+';font-weight:700\">'+status+'\u003c/p>\u003cp style=\"margin:7px 0\">Device fetch: '+esc(checked?new Date(checked).toLocaleString():'Not yet fetched')+(age===null?'':' \u00b7 '+age+' minutes ago')+'\u003c/p>\u003cp style=\"margin:7px 0\">NFL publication date for individual players: \u003cstrong style=\"color:#ffcf79\">NOT VERIFIED\u003c/strong>\u003c/p>\u003cp style=\"margin:7px 0\">'+esc(dateInfo)+'\u003c/p>\u003cp style=\"margin:7px 0;font-size:.88em\">A recent fetch can still return an older report. Before a lineup decision, check the official NFL report and the player\u2019s team update.\u003c/p>\u003c/section>';\n}\nfunction panel(){\n const names=[...new Set(Object.values(db).flat().map(p=>p[0]).filter(Boolean))];\n const matches=names.map(name=>({name,records:rows.filter(r=>norm(r.name)===norm(name))})).filter(x=>x.records.length);\n const flagged=matches.filter(x=>x.records.some(r=>concern(r).important));\n let changed=[];\n if(prior&&prior.records&&rows.length){\n  for(const x of matches)for(const r of x.records){\n   const key=norm(x.name)+\"|\"+r.team;\n   const old=prior.records[key];\n   if(old&&(old.designation!==r.designation||old.practice!==r.practice))\n     changed.push({name:x.name,from:old.practice+\" / \"+old.designation,to:r.practice+\" / \"+r.designation});\n  }\n }\n const ranked=[...matches].filter(x=>(!onlyConcerns||x.records.some(r=>concern(r).important))&&(!searchName||x.name.toLowerCase().includes(searchName.toLowerCase()))).sort((a,b)=>Math.max(...b.records.map(priority))-Math.max(...a.records.map(priority)) || a.name.localeCompare(b.name));\n const list=ranked.map(x=>{\n  const unique=[...new Map(x.records.map(r=>[norm(r.name)+'|'+r.injury+'|'+r.practice+'|'+r.designation,r])).values()].sort((a,b)=>priority(b)-priority(a));\n  const descriptions=unique.map(r=>{\n   const c=concern(r),d=valid(r.designation)?r.designation.trim():'';\n   const injury=valid(r.injury)?r.injury.trim():'';\n   const clear=c.level==='Full practice'&&!d;\n   const tone=c.important?'#ff707a':clear?'#5be29b':'#c4cbd8';\n   const label=d?d.toUpperCase()+(injury?' \u2014 '+injury:''):c.important?'PRACTICE CONCERN'+(injury?' \u2014 '+injury:''):clear?'FULL PRACTICE \u2014 NO GAME DESIGNATION':'STATUS NEEDS REVIEW';\n   const practice=c.important&&valid(r.practice)?'\u003csmall style=\"display:block;color:#c4cbd8;margin-top:3px\">Practice: '+esc(r.practice)+'\u003c/small>':'';\n   return '\u003cdiv style=\"margin-top:8px\">\u003csmall style=\"display:block;color:'+tone+';font-weight:700\">'+esc(label)+'\u003c/small>'+practice+'\u003c/div>';\n  }).join('');\n  return '\u003cdiv class=\"player\">\u003cdiv class=\"details\">\u003cstrong>'+esc(x.name)+'\u003c/strong>'+descriptions+'\u003c/div>\u003c/div>';\n }).join('');\n return `\u003cdiv class=\"note\">\u003ch3>\ud83c\udf93 V5.9 \u00b7 Seventh-grade source audit\u003c/h3>\u003cp>Source audit separates device fetch time from NFL publication time. Search and concern filters remain available. Red = concern; green = full practice without a game designation; gray = uncertain. ESPN and manual reports remain unchanged.\u003c/p>\u003cbutton id=\"read-nfl-54\" class=\"secondary\">Refresh official NFL report\u003c/button> \u003cbutton id=\"toggle-concerns-57\" class=\"secondary\">${onlyConcerns?'Show all roster matches':'Show concerns only'}\u003c/button>\u003cp>\u003clabel for=\"nfl-player-search-58\">Find a roster player\u003c/label>\u003cinput id=\"nfl-player-search-58\" type=\"search\" placeholder=\"Type a player name\" value=\"${esc(searchName).replace(/\"/g,\"&quot;\")}\" style=\"display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #64748b;border-radius:9px;background:#111c30;color:white;margin-top:6px\">\u003c/p>${dateAudit()}\u003cp>\u003cstrong>${esc(readState)}\u003c/strong>${error?' \u00b7 '+esc(error):''}\u003c/p>\u003cp>\u003cstrong>${flagged.length}\u003c/strong> roster players with a game designation or practice limitation \u00b7 \u003cstrong>${matches.length}\u003c/strong> roster names found \u00b7 \u003cstrong>${rows.length}\u003c/strong> NFL report rows\u003c/p>${changed.length?`\u003ch4>Changes since last check on this device\u003c/h4>${changed.map(x=>`\u003cp>${esc(x.name)}: ${esc(x.from)} \u2192 ${esc(x.to)}\u003c/p>`).join(\"\")}`:'\u003cp>\u003csmall>No changes detected in comparable saved fields, or no earlier baseline. This does not confirm that NFL reports are unchanged.\u003c/small>\u003c/p>'}${list||'\u003cp>No matches for this filter. Refresh NFL or show all roster matches.\u003c/p>'}\u003cp>\u003csmall>Practice participation is not a game designation. Name-only matches can be ambiguous because NFL team IDs are not extracted. NFL page changes and missing publication dates require manual verification.\u003c/small>\u003c/p>\u003ca href=\"https://www.nfl.com/injuries/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#a7caff\">Check original NFL reports\u003c/a>\u003c/div>`;\n}\nv5Sources=function(){return panel()+prevSources()};\nconst prevRender=render;\nrender=function(){prevRender();if(tab===\"injuries\"){const b=document.getElementById(\"read-nfl-54\");if(b)b.onclick=readNFL54;const t=document.getElementById(\"toggle-concerns-57\");if(t)t.onclick=()=>{onlyConcerns=!onlyConcerns;render()};const q=document.getElementById(\"nfl-player-search-58\");if(q)q.oninput=()=>{searchName=q.value;const panel=q.closest(\".note\");if(panel){const cursor=q.selectionStart;render();const newer=document.getElementById(\"nfl-player-search-58\");if(newer){newer.focus();newer.setSelectionRange(cursor,cursor)}}}}};\nasync function readNFL54(){\n readState=\"Reading official NFL page\u2026\";error=\"\";render();\n try{\n  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);\n  let response;try{response=await fetch(\"https://www.nfl.com/injuries/\",{cache:\"no-store\",signal:controller.signal})}finally{clearTimeout(timer)}\n  if(!response.ok)throw Error(\"HTTP \"+response.status);\n  const doc=new DOMParser().parseFromString(await response.text(),\"text/html\"),next=[];const dateSet=new Set();\n  for(const tr of doc.querySelectorAll(\"tr\")){\n   const td=[...tr.querySelectorAll(\"td\")].map(c=>c.textContent.replace(/\\s+/g,\" \").trim());\n   if(td.length>=5&&td[0]&&/participat/i.test(td[3])){const table=tr.closest(\"table\");const date=sourceDate(table);if(date)dateSet.add(date);next.push({name:td[0],team:\"\",injury:td[2],practice:td[3],designation:td[4]});}\n  }\n  if(!next.length)throw Error(\"No player rows parsed; NFL page layout may have changed\");\n  rows=next;reportDates=[...dateSet].slice(0,8);checked=new Date().toISOString();readState=\"Parsed \"+rows.length+\" NFL rows (experimental)\";\n  // Retain previous snapshot for comparison during this session. Persist new baseline only after displaying comparison.\n  const newRecords={};\n  for(const r of rows)newRecords[norm(r.name)+\"|\"+r.team]={practice:r.practice,designation:r.designation};\n  const old=prior;\n  // Display change comparison before committing the new snapshot.\n  render();\n  prior={checked,records:newRecords};\n  try{localStorage.setItem(KEY54,JSON.stringify(prior))}catch(e){}\n  // Keep visible comparison until the next fetch; don't rerender here.\n  if(!old)readState+=\" \u00b7 baseline saved\";\n }catch(e){error=String(e.message||e);readState=\"NFL read not verified\";rows=[];render()}\n}\nrender();\n})();\n\u003c/script>\n";page=page.replace(/<\/body>/i,extension+'</body>');if(!page.includes(extension))throw Error('Could not attach reader');document.open();document.write(page);document.close()}catch(e){document.body.textContent='Could not load dashboard: '+e.message+'. V4 remains untouched.'}})();
