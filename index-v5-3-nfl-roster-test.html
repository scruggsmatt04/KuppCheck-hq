<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KuppCheck HQ V5.3</title></head><body style="font:18px system-ui;background:#0b1220;color:white;padding:20px"><p>Loading KuppCheck full dashboard + NFL reader…</p><script>
(async()=>{try{const response=await fetch('./index-v5-nfl-test.html',{cache:'no-store'});if(!response.ok)throw Error('Dashboard HTTP '+response.status);let page=await response.text();const extension="\u003cscript>\n(function(){\nconst oldSources=v5Sources;\nlet nflRows=[],nflState='Not loaded',nflChecked='',nflError='';\nconst norm=s=>String(s||'').toLowerCase().replace(/\\b(jr|sr|ii|iii|iv)\\b\\.?/g,'').replace(/[^a-z0-9]/g,'');\nfunction readPanel(){\nconst roster=[...new Set(Object.values(db).flat().map(p=>p[0]).filter(Boolean))];\nconst matches=roster.map(name=>({name,rows:nflRows.filter(r=>norm(r.name)===norm(name))})).filter(x=>x.rows.length);\nconst discrepancies=matches.filter(x=>x.rows.some(r=>r.designation&&r.designation!=='-'&&r.designation.toLowerCase()!=='unspecified'));\nreturn `\u003cdiv class=\"note\">\u003ch3>\ud83c\udfeb V5.3 \u00b7 NFL Injury Reader\u003c/h3>\u003cp>Experimental direct NFL report extraction. Checks both roster snapshots; does not overwrite ESPN statuses or historical events.\u003c/p>\u003cbutton id=\"read-nfl-53\" class=\"secondary\">Load NFL report and match my players\u003c/button>\u003cp>\u003cstrong>NFL:\u003c/strong> ${esc(nflState)}\u003c/p>${nflError?`\u003cp class=\"status\">${esc(nflError)}\u003c/p>`:''}\u003cp>\u003csmall>Fetch time: ${esc(nflChecked||'Not fetched')} \u00b7 This is not the report's publication time.\u003c/small>\u003c/p>\u003cp>\u003cstrong>${matches.length}\u003c/strong> roster-name matches across \u003cstrong>${nflRows.length}\u003c/strong> NFL rows.\u003c/p>${matches.length?matches.map(x=>`\u003cdiv class=\"player\">\u003cdiv class=\"details\">\u003cstrong>${esc(x.name)}\u003c/strong>${x.rows.map(r=>`\u003csmall>${esc(r.injury)} \u00b7 Practice: ${esc(r.practice)} \u00b7 Designation: ${esc(r.designation||'Not specified')}\u003c/small>`).join('')}\u003c/div>\u003c/div>`).join(''):'\u003cp class=\"muted\">No matches yet. Run the reader; some healthy players may not appear in injury reports.\u003c/p>'}\u003cp>\u003csmall>Names are normalized, but duplicate names can cause false matches. Always verify team and report date on NFL.com before making decisions.\u003c/small>\u003c/p>\u003ca href=\"https://www.nfl.com/injuries/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#a7caff\">View original NFL reports\u003c/a>\u003c/div>`;\n}\nv5Sources=function(){return readPanel()+oldSources()};\nconst oldRender=render;\nrender=function(){oldRender();if(tab==='injuries'){const btn=document.getElementById('read-nfl-53');if(btn)btn.onclick=loadNFL}};\nasync function loadNFL(){\nnflState='Fetching official NFL page\u2026';nflError='';render();\ntry{\nconst controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);\nlet response;try{response=await fetch('https://www.nfl.com/injuries/',{cache:'no-store',signal:controller.signal})}finally{clearTimeout(timer)}\nif(!response.ok)throw Error('HTTP '+response.status);\nconst doc=new DOMParser().parseFromString(await response.text(),'text/html');const rows=[];\nfor(const tr of doc.querySelectorAll('tr')){const td=[...tr.querySelectorAll('td')].map(x=>x.textContent.replace(/\\s+/g,' ').trim());if(td.length>=5&&td[0]&&/participat/i.test(td[3]))rows.push({name:td[0],injury:td[2],practice:td[3],designation:td[4]})}\nnflRows=rows;nflChecked=new Date().toLocaleString();nflState=rows.length?'Read '+rows.length+' player rows \u00b7 experimental':'No player records extracted';\nif(!rows.length)nflError='Page layout may have changed. NFL is not verified.';\n}catch(e){nflRows=[];nflState='Read failed';nflError=String(e.message||e)+'; ESPN remains available.'}\nrender();\n}\nrender();\n})();\n\u003c/script>";page=page.replace(/<\/body>/i,extension+'</body>');if(!page.includes(extension))throw Error('Could not attach injury reader');document.open();document.write(page);document.close()}catch(e){document.body.textContent='Could not load full dashboard: '+e.message+' — original V5.1 and V4 remain unchanged.'}})();
</script></body></html>
