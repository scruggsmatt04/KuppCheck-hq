<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KuppCheck HQ V6.2 Tenth Grade</title></head><body style="font:18px system-ui;background:#0b1220;color:white;padding:20px"><p>Loading KuppCheck dashboard + tenth-grade conflict detection…</p><script>
(async()=>{try{const r=await fetch('./index-v5-nfl-test.html',{cache:'no-store'});if(!r.ok)throw Error('Dashboard HTTP '+r.status);let page=await r.text();const extension="\n\u003cscript>\n(function(){\nconst prevSources=v5Sources;\nlet rows=[],readState=\"Not loaded\",checked=\"\",error=\"\",prior=null,onlyConcerns=false,reportDates=[],searchName=\"\",lastChanges=[],baselineInfo=\"\",previousChecked=\"\";\nfunction freshness(){\n if(!checked)return 'No NFL check completed yet.';\n const age=Date.now()-Date.parse(checked);\n if(!Number.isFinite(age))return 'Check time unavailable; NFL report date unverified.';\n const hours=Math.max(0,Math.floor(age/3600000));\n return (hours>=24?'\u26a0\ufe0f Last fetch is '+hours+' hours old. Recheck before lineup decisions.':hours>=2?'Last fetch '+hours+' hours ago. Recheck near kickoff.':'Recently fetched on this device.')+' This is NOT the NFL publication time.';\n}\nfunction sourceDate(table){\n // Only accept a complete explicit month/day/year, never infer it from retrieval time.\n const area=table?.parentElement?.parentElement;\n const heading=[...((area&&area.querySelectorAll('h1,h2,h3,h4,caption'))||[])].map(x=>x.textContent.trim()).join(' ');\n const match=heading.match(/\\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\\s+\\d{1,2},?\\s+20\\d{2}\\b/i);\n return match?match[0]:'';\n}\nfunction evidence(r){\n const d=(r.designation||'').trim(),p=(r.practice||'').trim();\n const game=/^(out|doubtful|questionable)$/i.test(d);\n const participation=/did not participate|limited participation|full participation/i.test(p);\n const freshnessOk=checked&&Date.now()-Date.parse(checked)\u003c2*3600000;\n const tag=game?'GAME DESIGNATION':participation?'PRACTICE REPORT':'UNVERIFIED STATUS';\n const note=game?'NFL page lists a game designation. Confirm team, matchup, and report date before acting.':participation?'NFL page lists practice participation, NOT a game availability decision.':'Not enough source detail for an availability conclusion.';\n return {tag,note,freshnessOk};\n}\nconst KEY54=\"kuppcheck-v54-nfl-snapshot\";\ntry {prior=JSON.parse(localStorage.getItem(KEY54)||\"null\")}catch(e){}\nif(prior&&prior.checked)previousChecked=prior.checked;\nconst norm=s=>String(s||\"\").toLowerCase().replace(/\\b(jr|sr|ii|iii|iv)\\b\\.?/g,\"\").replace(/[^a-z0-9]/g,\"\");\nconst valid=s=>s&&s.trim()&&s.trim()!==\"-\"&&s.trim().toLowerCase()!==\"unspecified\";\nfunction concern(r){\n const d=(r.designation||\"\").toLowerCase(),p=(r.practice||\"\").toLowerCase();\n if(/\\b(out|doubtful|questionable)\\b/.test(d))return {level:\"Game designation\",important:true};\n if(/did not participate|dnp|limited participation|limited practice/.test(p))return {level:\"Practice limitation\",important:true};\n if(/full participation|full practice/.test(p))return {level:\"Full practice\",important:false};\n return {level:\"Needs review\",important:false};\n}\nfunction priority(r){const d=(r.designation||'').toLowerCase(),p=(r.practice||'').toLowerCase();if(/\\bout\\b/.test(d))return 5;if(/\\bdoubtful\\b/.test(d))return 4;if(/\\bquestionable\\b/.test(d))return 3;if(/did not participate|dnp/.test(p))return 2;if(/limited participation|limited practice/.test(p))return 1;return 0;}\nfunction dateAudit(){\n const verified=reportDates.length;\n const age=checked?Math.max(0,Math.floor((Date.now()-Date.parse(checked))/60000)):null;\n const status=age===null?'NOT CHECKED':age>=120?'RECHECK ADVISED':'RECENTLY FETCHED';\n const color=age===null?'#c4cbd8':age>=120?'#ff707a':'#5be29b';\n const dateInfo=verified?'Found '+verified+' date label(s) near NFL tables (context only)':'No complete dates verified near NFL tables';\n return '\u003csection style=\"padding:13px;border:1px solid #64748b;border-radius:10px;margin:12px 0;background:#101b2b\">\u003cstrong>\ud83d\udd0e Ninth-grade evidence check\u003c/strong>\u003cp style=\"margin:8px 0;color:'+color+';font-weight:700\">'+status+'\u003c/p>\u003cp style=\"margin:7px 0\">Device fetch: '+esc(checked?new Date(checked).toLocaleString():'Not yet fetched')+(age===null?'':' \u00b7 '+age+' minutes ago')+'\u003c/p>\u003cp style=\"margin:7px 0\">NFL publication date for individual players: \u003cstrong style=\"color:#ffcf79\">NOT VERIFIED\u003c/strong>\u003c/p>\u003cp style=\"margin:7px 0\">'+esc(dateInfo)+'\u003c/p>\u003cp style=\"margin:7px 0;font-size:.88em\">EVIDENCE RULE: A retrieved NFL row is not proof of a current injury, a confirmed team match, or a player\u2019s game availability. Check the NFL source and team before lineup decisions.\u003c/p>\u003c/section>';\n}\n\nfunction conflictAudit(){\n const byName=new Map();\n for(const r of rows){const key=norm(r.name);if(!key)continue;if(!byName.has(key))byName.set(key,[]);byName.get(key).push(r)}\n const conflicts=[];\n for(const [key,rs] of byName){\n  if(rs.length\u003c2)continue;\n  const normalized=(field)=>[...new Set(rs.map(r=>String(r[field]||'').trim().toLowerCase()).filter(Boolean))];\n  const differing=['designation','practice','injury'].filter(field=>normalized(field).length>1);\n  if(differing.length)conflicts.push({key,name:rs[0].name,fields:differing,records:rs});\n }\n return conflicts;\n}\nfunction conflictPanel(){\n const conflicts=conflictAudit();\n const rosterKeys=new Set(Object.values(db).flat().map(p=>norm(p[0])).filter(Boolean));\n const relevant=conflicts.filter(c=>rosterKeys.has(c.key));\n const fmt=r=>[r.designation||'No game designation',r.practice||'Practice unknown',r.injury||'Injury unspecified'].join(' \u00b7 ');\n return '\u003csection style=\"padding:13px;border:1px solid #eab308;border-radius:10px;margin:12px 0;background:#241f15\">'+\n '\u003cstrong>\ud83d\udd75\ufe0f Tenth-grade conflict detector\u003c/strong>'+\n '\u003cp style=\"margin:7px 0\">'+(rows.length?'\u003cstrong>'+relevant.length+'\u003c/strong> roster player(s) with differing NFL rows \u00b7 '+conflicts.length+' across all parsed NFL names':'Run an NFL refresh to check for conflicting rows.')+'\u003c/p>'+\n (relevant.length?relevant.slice(0,12).map(c=>'\u003cdiv style=\"border-top:1px solid #675b37;padding-top:9px;margin-top:9px\">\u003cstrong style=\"color:#ffcf79\">\u26a0\ufe0f '+esc(c.name)+'\u003c/strong>\u003csmall style=\"display:block\">Different fields: '+esc(c.fields.join(', '))+'\u003c/small>'+c.records.slice(0,4).map(r=>'\u003csmall style=\"display:block;color:#e7d8b4;margin-top:4px\">'+esc(fmt(r))+'\u003c/small>').join('')+'\u003c/div>').join(''):'\u003cp style=\"font-size:.9em\">No conflicting duplicate rows found for your roster in this fetch. That does not verify accuracy or rule out conflicts on other sources.\u003c/p>')+\n '\u003cp style=\"font-size:.85em;color:#ffcf79\">\u26a0\ufe0f Different rows may represent different teams, practices or report dates. Team and row-level dates are not verified, so conflicts require manual checking; no automatic availability verdict.\u003c/p>\u003c/section>';\n}\n\nfunction panel(){\n const names=[...new Set(Object.values(db).flat().map(p=>p[0]).filter(Boolean))];\n const matches=names.map(name=>({name,records:rows.filter(r=>norm(r.name)===norm(name))})).filter(x=>x.records.length);\n const flagged=matches.filter(x=>x.records.some(r=>concern(r).important));\n const changed=lastChanges;\n const ranked=[...matches].filter(x=>(!onlyConcerns||x.records.some(r=>concern(r).important))&&(!searchName||x.name.toLowerCase().includes(searchName.toLowerCase()))).sort((a,b)=>Math.max(...b.records.map(priority))-Math.max(...a.records.map(priority)) || a.name.localeCompare(b.name));\n const list=ranked.map(x=>{\n  const unique=[...new Map(x.records.map(r=>[norm(r.name)+'|'+r.injury+'|'+r.practice+'|'+r.designation,r])).values()].sort((a,b)=>priority(b)-priority(a));\n  const hasConflict=conflictAudit().some(c=>c.key===norm(x.name));\n  const descriptions=unique.map(r=>{\n   const c=concern(r),d=valid(r.designation)?r.designation.trim():'';\n   const injury=valid(r.injury)?r.injury.trim():'';\n   const clear=c.level==='Full practice'&&!d;\n   const tone=c.important?'#ff707a':clear?'#5be29b':'#c4cbd8';\n   const label=d?d.toUpperCase()+(injury?' \u2014 '+injury:''):c.important?'PRACTICE CONCERN'+(injury?' \u2014 '+injury:''):clear?'FULL PRACTICE \u2014 NO GAME DESIGNATION':'STATUS NEEDS REVIEW';\n   const ev=evidence(r);const evidenceLine='\u003csmall style=\"display:block;color:#ffcf79;margin-top:4px\">'+esc(ev.tag)+' \u00b7 '+esc(ev.note)+(ev.freshnessOk?'':' \u00b7 \u26a0\ufe0f Fetch older than 2 hours or not verified')+'\u003c/small>';const practice=c.important&&valid(r.practice)?'\u003csmall style=\"display:block;color:#c4cbd8;margin-top:3px\">Practice: '+esc(r.practice)+'\u003c/small>':'';\n   return '\u003cdiv style=\"margin-top:8px\">\u003csmall style=\"display:block;color:'+tone+';font-weight:700\">'+esc(label)+'\u003c/small>'+practice+evidenceLine+'\u003c/div>';\n  }).join('');\n  return '\u003cdiv class=\"player\">\u003cdiv class=\"details\">\u003cstrong>'+esc(x.name)+'\u003c/strong>'+(hasConflict?'\u003csmall style=\"display:block;color:#ffcf79\">\u26a0\ufe0f CONFLICTING NFL ROWS \u2014 VERIFY\u003c/small>':'')+descriptions+'\u003c/div>\u003c/div>';\n }).join('');\n return `\u003cdiv class=\"note\">\u003ch3>\ud83c\udf93 V6.2 \u00b7 Tenth-grade conflict detection\u003c/h3>\u003cp>Flags differing injury, practice, or game-designation rows for the same player without guessing which one is right. Keeps evidence warnings and manual verification. The change tracker remains available. Search and concern filters remain available. Red = concern; green = full practice without a game designation; gray = uncertain. ESPN and manual reports remain unchanged.\u003c/p>\u003cbutton id=\"read-nfl-54\" class=\"secondary\">Refresh official NFL report\u003c/button> \u003cbutton id=\"toggle-concerns-57\" class=\"secondary\">${onlyConcerns?'Show all roster matches':'Show concerns only'}\u003c/button>\u003cp>\u003clabel for=\"nfl-player-search-58\">Find a roster player\u003c/label>\u003cinput id=\"nfl-player-search-58\" type=\"search\" placeholder=\"Type a player name\" value=\"${esc(searchName).replace(/\"/g,\"&quot;\")}\" style=\"display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #64748b;border-radius:9px;background:#111c30;color:white;margin-top:6px\">\u003c/p>${dateAudit()}${conflictPanel()}\u003cp>\u003cstrong>${esc(readState)}\u003c/strong>${error?' \u00b7 '+esc(error):''}\u003c/p>\u003cp>\u003cstrong>${flagged.length}\u003c/strong> roster players with a game designation or practice limitation (not necessarily ruled out) \u00b7 \u003cstrong>${matches.length}\u003c/strong> roster names found \u00b7 \u003cstrong>${rows.length}\u003c/strong> NFL report rows\u003c/p>\u003csection style=\"padding:12px;border:1px solid #64748b;border-radius:10px;margin:12px 0;background:#111b2c\">\u003ch4 style=\"margin:0 0 8px\">\ud83d\udcc8 Changes between saved checks\u003c/h4>\u003cp style=\"margin:6px 0;font-size:.9em\">${esc(baselineInfo||'Run a refresh to compare against your previous successful check on this device.')}\u003c/p>${changed.length?changed.map(x=>`\u003cp style=\"border-top:1px solid #334155;padding-top:9px\">\u003cstrong>${esc(x.name)}\u003c/strong> \u003cspan style=\"color:${x.color};font-weight:700\">${esc(x.label)}\u003c/span>\u003csmall style=\"display:block;color:#c4cbd8\">Before: ${esc(x.from)}\u003cbr>Now: ${esc(x.to)}\u003c/small>\u003c/p>`).join(''):'\u003cp>\u003csmall>No confirmed differences to display. This can mean no changes, no prior baseline, or missing comparable records.\u003c/small>\u003c/p>'}\u003cp style=\"font-size:.8em;color:#c4cbd8\">Changes are detected at download time, not when the NFL originally updated them. Missing players are not automatically considered healthy.\u003c/p>\u003c/section>${list||'\u003cp>No matches for this filter. Refresh NFL or show all roster matches.\u003c/p>'}\u003cp>\u003csmall>Practice participation is not a game designation. Name-only matches can be ambiguous because NFL team IDs are not extracted. NFL page changes and missing publication dates require manual verification.\u003c/small>\u003c/p>\u003ca href=\"https://www.nfl.com/injuries/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#a7caff\">Check original NFL reports\u003c/a>\u003c/div>`;\n}\nv5Sources=function(){return panel()+prevSources()};\nconst prevRender=render;\nrender=function(){prevRender();if(tab===\"injuries\"){const b=document.getElementById(\"read-nfl-54\");if(b)b.onclick=readNFL54;const t=document.getElementById(\"toggle-concerns-57\");if(t)t.onclick=()=>{onlyConcerns=!onlyConcerns;render()};const q=document.getElementById(\"nfl-player-search-58\");if(q)q.oninput=()=>{searchName=q.value;const panel=q.closest(\".note\");if(panel){const cursor=q.selectionStart;render();const newer=document.getElementById(\"nfl-player-search-58\");if(newer){newer.focus();newer.setSelectionRange(cursor,cursor)}}}}};\nasync function readNFL54(){\n readState=\"Reading official NFL page\u2026\";error=\"\";render();\n try{\n  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);\n  let response;try{response=await fetch(\"https://www.nfl.com/injuries/\",{cache:\"no-store\",signal:controller.signal})}finally{clearTimeout(timer)}\n  if(!response.ok)throw Error(\"HTTP \"+response.status);\n  const doc=new DOMParser().parseFromString(await response.text(),\"text/html\"),next=[];const dateSet=new Set();\n  for(const tr of doc.querySelectorAll(\"tr\")){\n   const td=[...tr.querySelectorAll(\"td\")].map(c=>c.textContent.replace(/\\s+/g,\" \").trim());\n   if(td.length>=5&&td[0]&&/participat/i.test(td[3])){const table=tr.closest(\"table\");const date=sourceDate(table);if(date)dateSet.add(date);next.push({name:td[0],team:\"\",injury:td[2],practice:td[3],designation:td[4]});}\n  }\n  if(!next.length)throw Error(\"No player rows parsed; NFL page layout may have changed\");\n  rows=next;reportDates=[...dateSet].slice(0,8);checked=new Date().toISOString();readState=\"Parsed \"+rows.length+\" NFL rows (experimental)\";\n  const newRecords={};\n  for(const r of rows)newRecords[norm(r.name)+\"|\"+r.team]={practice:r.practice,designation:r.designation,injury:r.injury,name:r.name};\n  lastChanges=[];\n  if(prior&&prior.records){\n   for(const [key,now] of Object.entries(newRecords)){\n    const before=prior.records[key];\n    if(!before)continue; // No verified previous entry; not proof of a new injury.\n    if(before.practice===now.practice&&before.designation===now.designation&&(!before.injury||before.injury===now.injury))continue;\n    const oldPriority=priority(before),newPriority=priority(now);\n    const label=newPriority>oldPriority?'WORSENED':newPriority\u003coldPriority?'IMPROVED':'REPORT UPDATED';\n    const color=newPriority>oldPriority?'#ff707a':newPriority\u003coldPriority?'#5be29b':'#ffcf79';\n    const desc=r=>[r.injury||'Injury unspecified',r.practice||'Practice unknown',r.designation||'No game designation'].join(' \u00b7 ');\n    lastChanges.push({name:now.name||key.split('|')[0],from:desc(before),to:desc(now),label,color});\n   }\n   baselineInfo='Compared previous fetch '+(prior.checked?new Date(prior.checked).toLocaleString():'(time unavailable)')+' with current fetch '+new Date(checked).toLocaleString()+'. '+lastChanges.length+' changed comparable player entries.';\n  }else{\n   baselineInfo='First successful check saved as baseline. Refresh again later to see changes.';\n  }\n  prior={checked,records:newRecords};\n  try{localStorage.setItem(KEY54,JSON.stringify(prior))}catch(e){}\n  render();\n }catch(e){error=String(e.message||e);readState=\"NFL read not verified\";rows=[];render()}\n}\nrender();\n})();\n\u003c/script>\n";page=page.replace(/<\/body>/i,extension+'</body>');if(!page.includes(extension))throw Error('Could not attach reader');document.open();document.write(page);document.close()}catch(e){document.body.textContent='Could not load dashboard: '+e.message+'. V4 remains untouched.'}})();
</script></body></html>
