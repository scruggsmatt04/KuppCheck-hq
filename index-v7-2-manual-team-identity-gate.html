(async()=>{try{const r=await fetch('./index-v5-nfl-test.html',{cache:'no-store'});if(!r.ok)throw Error('Dashboard HTTP '+r.status);let page=await r.text();const extension="\n\u003cscript\u003e\n(function(){\nconst prevSources=v5Sources;\nlet demoMode=false;\nlet rows=[],readState=\"Not loaded\",checked=\"\",error=\"\",prior=null,onlyConcerns=false,reportDates=[],searchName=\"\",lastChanges=[],baselineInfo=\"\",previousChecked=\"\";\nfunction freshness(){\n if(!checked)return 'No NFL check completed yet.';\n const age=Date.now()-Date.parse(checked);\n if(!Number.isFinite(age))return 'Check time unavailable; NFL report date unverified.';\n const hours=Math.max(0,Math.floor(age/3600000));\n return (hours\u003e=24?'\u26a0\ufe0f Last fetch is '+hours+' hours old. Recheck before lineup decisions.':hours\u003e=2?'Last fetch '+hours+' hours ago. Recheck near kickoff.':'Recently fetched on this device.')+' This is NOT the NFL publication time.';\n}\nfunction sourceDate(table){\n // Only accept a complete explicit month/day/year, never infer it from retrieval time.\n const area=table?.parentElement?.parentElement;\n const heading=[...((area&&area.querySelectorAll('h1,h2,h3,h4,caption'))||[])].map(x=\u003ex.textContent.trim()).join(' ');\n const match=heading.match(/\\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\\s+\\d{1,2},?\\s+20\\d{2}\\b/i);\n return match?match[0]:'';\n}\nfunction evidence(r){\n const d=(r.designation||'').trim(),p=(r.practice||'').trim();\n const game=/^(out|doubtful|questionable)$/i.test(d);\n const participation=/did not participate|limited participation|full participation/i.test(p);\n const freshnessOk=checked&&Date.now()-Date.parse(checked)\u003c2*3600000;\n const tag=game?'GAME DESIGNATION':participation?'PRACTICE REPORT':'UNVERIFIED STATUS';\n const note=game?'NFL page lists a game designation. Confirm team, matchup, and report date before acting.':participation?'NFL page lists practice participation, NOT a game availability decision.':'Not enough source detail for an availability conclusion.';\n return {tag,note,freshnessOk};\n}\nconst KEY54=\"kuppcheck-v54-nfl-snapshot\";\ntry {prior=JSON.parse(localStorage.getItem(KEY54)||\"null\")}catch(e){}\nif(prior&&prior.checked)previousChecked=prior.checked;\nconst norm=s=\u003eString(s||\"\").toLowerCase().replace(/\\b(jr|sr|ii|iii|iv)\\b\\.?/g,\"\").replace(/[^a-z0-9]/g,\"\");\nconst valid=s=\u003es&&s.trim()&&s.trim()!==\"-\"&&s.trim().toLowerCase()!==\"unspecified\";\nfunction concern(r){\n const d=(r.designation||\"\").toLowerCase(),p=(r.practice||\"\").toLowerCase();\n if(/\\b(out|doubtful|questionable)\\b/.test(d))return {level:\"Game designation\",important:true};\n if(/did not participate|dnp|limited participation|limited practice/.test(p))return {level:\"Practice limitation\",important:true};\n if(/full participation|full practice/.test(p))return {level:\"Full practice\",important:false};\n return {level:\"Needs review\",important:false};\n}\nfunction priority(r){const d=(r.designation||'').toLowerCase(),p=(r.practice||'').toLowerCase();if(/\\bout\\b/.test(d))return 5;if(/\\bdoubtful\\b/.test(d))return 4;if(/\\bquestionable\\b/.test(d))return 3;if(/did not participate|dnp/.test(p))return 2;if(/limited participation|limited practice/.test(p))return 1;return 0;}\nfunction dateAudit(){\n const verified=reportDates.length;\n const age=checked?Math.max(0,Math.floor((Date.now()-Date.parse(checked))/60000)):null;\n const status=age===null?'NOT CHECKED':age\u003e=120?'RECHECK ADVISED':'RECENTLY FETCHED';\n const color=age===null?'#c4cbd8':age\u003e=120?'#ff707a':'#5be29b';\n const dateInfo=verified?'Found '+verified+' date label(s) near NFL tables (context only)':'No complete dates verified near NFL tables';\n return '\u003csection style=\"padding:13px;border:1px solid #64748b;border-radius:10px;margin:12px 0;background:#101b2b\"\u003e\u003cstrong\u003e\ud83d\udd0e Ninth-grade evidence check\u003c/strong\u003e\u003cp style=\"margin:8px 0;color:'+color+';font-weight:700\"\u003e'+status+'\u003c/p\u003e\u003cp style=\"margin:7px 0\"\u003eDevice fetch: '+esc(checked?new Date(checked).toLocaleString():'Not yet fetched')+(age===null?'':' \u00b7 '+age+' minutes ago')+'\u003c/p\u003e\u003cp style=\"margin:7px 0\"\u003eNFL publication date for individual players: \u003cstrong style=\"color:#ffcf79\"\u003eNOT VERIFIED\u003c/strong\u003e\u003c/p\u003e\u003cp style=\"margin:7px 0\"\u003e'+esc(dateInfo)+'\u003c/p\u003e\u003cp style=\"margin:7px 0;font-size:.88em\"\u003eEVIDENCE RULE: A retrieved NFL row is not proof of a current injury, a confirmed team match, or a player\u2019s game availability. Check the NFL source and team before lineup decisions.\u003c/p\u003e\u003c/section\u003e';\n}\n\nfunction conflictAudit(){\n const byName=new Map();\n for(const r of rows){const key=norm(r.name)+'|'+String(r.position||'').toLowerCase()+'|'+String(r.team||'unknown');if(!norm(r.name))continue;if(!byName.has(key))byName.set(key,[]);byName.get(key).push(r)}\n const conflicts=[];\n for(const [key,rs] of byName){\n  if(rs.length\u003c2)continue;\n  const normalized=(field)=\u003e[...new Set(rs.map(r=\u003eString(r[field]||'').trim().toLowerCase()).filter(Boolean))];\n  const differing=['designation','practice','injury'].filter(field=\u003enormalized(field).length\u003e1);\n  if(differing.length)conflicts.push({key,name:rs[0].name,fields:differing,records:rs});\n }\n return conflicts;\n}\nfunction playersForConflict71(c){return Object.values(db).flat().some(p=\u003ep&&norm(p[0])===c.key&&c.records.some(r=\u003eidentityMatch71(p,r).ok));}\nfunction conflictPanel(){\n const conflicts=conflictAudit();\n const rosterKeys=new Set(Object.values(db).flat().map(p=\u003enorm(p[0])).filter(Boolean));\n const relevant=conflicts.filter(c=\u003eplayersForConflict71(c));\n if(demoMode){\n  const sample=[\n   {name:'TEST PLAYER (SIMULATION)',injury:'Hamstring',practice:'Full Participation in Practice',designation:'Not designated'},\n   {name:'TEST PLAYER (SIMULATION)',injury:'Hamstring',practice:'Did Not Participate In Practice',designation:'Out'}\n  ];\n  relevant.unshift({key:'demo',name:'TEST PLAYER (SIMULATION)',fields:['practice','designation'],records:sample});\n }\n const fmt=r=\u003e[r.designation||'No game designation',r.practice||'Practice unknown',r.injury||'Injury unspecified'].join(' \u00b7 ');\n return '\u003csection style=\"padding:13px;border:1px solid #eab308;border-radius:10px;margin:12px 0;background:#241f15\"\u003e'+\n '\u003cstrong\u003e\ud83d\udd75\ufe0f Tenth-grade conflict detector\u003c/strong\u003e'+\n '\u003cp style=\"margin:7px 0\"\u003e'+(rows.length?'\u003cstrong\u003e'+relevant.length+'\u003c/strong\u003e roster player(s) with differing NFL rows \u00b7 '+conflicts.length+' across all parsed NFL names'+(demoMode?' (includes 1 simulated conflict)':''):'Run an NFL refresh to check for conflicting rows.')+'\u003c/p\u003e'+\n (relevant.length?relevant.slice(0,12).map(c=\u003e'\u003cdiv style=\"border-top:1px solid #675b37;padding-top:9px;margin-top:9px\"\u003e\u003cstrong style=\"color:#ffcf79\"\u003e\u26a0\ufe0f '+esc(c.name)+'\u003c/strong\u003e\u003csmall style=\"display:block\"\u003eDifferent fields: '+esc(c.fields.join(', '))+'\u003c/small\u003e'+c.records.slice(0,4).map(r=\u003e'\u003csmall style=\"display:block;color:#e7d8b4;margin-top:4px\"\u003e'+esc(fmt(r))+'\u003c/small\u003e').join('')+'\u003c/div\u003e').join(''):'\u003cp style=\"font-size:.9em\"\u003eNo conflicting duplicate rows found for your roster in this fetch. That does not verify accuracy or rule out conflicts on other sources.\u003c/p\u003e')+\n '\u003cp style=\"font-size:.85em;color:#ffcf79\"\u003e\u26a0\ufe0f Different rows may represent different teams, practices or report dates. Team and row-level dates are not verified, so conflicts require manual checking; no automatic availability verdict.\u003c/p\u003e\u003c/section\u003e';\n}\n\n\nfunction seniorSelfTest(){\n const samples=[\n  {name:'TEST A',injury:'Hamstring',practice:'Full Participation in Practice',designation:'Not designated'},\n  {name:'TEST A',injury:'Hamstring',practice:'Did Not Participate In Practice',designation:'Out'},\n  {name:'TEST B',injury:'Knee',practice:'Limited Participation in Practice',designation:'Questionable'},\n  {name:'TEST B',injury:'Knee',practice:'Limited Participation in Practice',designation:'Questionable'},\n  {name:'TEST C',injury:'Ankle',practice:'Full Participation in Practice',designation:'Not designated'}\n ];\n const grouped=new Map();for(const r of samples){if(!grouped.has(r.name))grouped.set(r.name,[]);grouped.get(r.name).push(r)}\n const detected=[...grouped].filter(([_,rs])=\u003ers.length\u003e1&&['injury','practice','designation'].some(k=\u003enew Set(rs.map(r=\u003er[k])).size\u003e1)).map(([name])=\u003ename);\n return {passed:detected.length===1&&detected[0]==='TEST A',detected};\n}\n\n\n// Grade 14: conservative team-label extraction. A label is evidence of page context,\n// not proof of a player's NFL identity or of the fantasy roster team.\nconst NFL_TEAMS14=['Arizona Cardinals','Atlanta Falcons','Baltimore Ravens','Buffalo Bills','Carolina Panthers','Chicago Bears','Cincinnati Bengals','Cleveland Browns','Dallas Cowboys','Denver Broncos','Detroit Lions','Green Bay Packers','Houston Texans','Indianapolis Colts','Jacksonville Jaguars','Kansas City Chiefs','Las Vegas Raiders','Los Angeles Chargers','Los Angeles Rams','Miami Dolphins','Minnesota Vikings','New England Patriots','New Orleans Saints','New York Giants','New York Jets','Philadelphia Eagles','Pittsburgh Steelers','San Francisco 49ers','Seattle Seahawks','Tampa Bay Buccaneers','Tennessee Titans','Washington Commanders'];\n// Grade 14 remediation: NFL uses short labels (\"Colts\", \"49ers\") as well as full names.\nconst TEAM_LABELS14={\n 'cardinals':'Arizona Cardinals','falcons':'Atlanta Falcons','ravens':'Baltimore Ravens','bills':'Buffalo Bills','panthers':'Carolina Panthers','bears':'Chicago Bears','bengals':'Cincinnati Bengals','browns':'Cleveland Browns','cowboys':'Dallas Cowboys','broncos':'Denver Broncos','lions':'Detroit Lions','packers':'Green Bay Packers','texans':'Houston Texans','colts':'Indianapolis Colts','jaguars':'Jacksonville Jaguars','chiefs':'Kansas City Chiefs','raiders':'Las Vegas Raiders','chargers':'Los Angeles Chargers','rams':'Los Angeles Rams','dolphins':'Miami Dolphins','vikings':'Minnesota Vikings','patriots':'New England Patriots','saints':'New Orleans Saints','giants':'New York Giants','jets':'New York Jets','eagles':'Philadelphia Eagles','steelers':'Pittsburgh Steelers','49ers':'San Francisco 49ers','seahawks':'Seattle Seahawks','buccaneers':'Tampa Bay Buccaneers','titans':'Tennessee Titans','commanders':'Washington Commanders'\n};\nfunction teamFromText14(s){\n const t=String(s||'').replace(/\\s+/g,' ').trim().toLowerCase().replace(/[:\\-]+$/,'').trim();\n if(TEAM_LABELS14[t])return TEAM_LABELS14[t];\n return NFL_TEAMS14.find(name=\u003ename.toLowerCase()===t)||'';\n}\nfunction teamForTable14(table){\n if(!table)return {team:'',reason:'Missing table',near:[]};\n const caption=table.querySelector('caption');\n if(caption){const t=teamFromText14(caption.textContent);if(t)return {team:t,reason:'Table caption',near:[caption.textContent.trim()]};}\n // Text-node traversal works even when NFL wraps headings in non-heading elements.\n // Never borrow a team name from an earlier player's table.\n const walker=table.ownerDocument.createTreeWalker(table.ownerDocument.body,NodeFilter.SHOW_TEXT);\n walker.currentNode=table;\n let inspected=0, snippets=[],candidates=[];\n while(inspected\u003c32){\n  const node=walker.previousNode();\n  if(!node)break;\n  const parent=node.parentElement;\n  if(!parent)continue;\n  if(parent.closest('table'))break;\n  if(parent.closest('script,style,nav,footer,header'))continue;\n  const raw=node.textContent.replace(/\\s+/g,' ').trim();\n  if(!raw)continue;\n  inspected++;\n  if(snippets.length\u003c10)snippets.push(raw.slice(0,55));\n  const team=teamFromText14(raw);\n  if(team)candidates.push({team,at:inspected});\n  // A team heading is normally directly above Player / Position / Injury labels.\n  // Beyond 12 visible text tokens, the ownership evidence is too weak.\n  if(inspected\u003e=12)break;\n }\n const nearest=candidates[0];\n if(!nearest)return {team:'',reason:'No team label in 12 preceding text nodes',near:snippets};\n if(nearest.at\u003e8)return {team:'',reason:'Team label too distant',near:snippets};\n // A nearby opponent label is not proof of table ownership; prefer a team label\n // followed only by table column headings.\n const intervening=snippets.slice(0,nearest.at-1).join(' ').toLowerCase();\n if(intervening && !/(player|position|injur|practice|game status)/.test(intervening))\n   return {team:'',reason:'Team label not next to table header',near:snippets};\n return {team:nearest.team,reason:'Adjacent table text (PROVISIONAL)',near:snippets};\n}\n\nfunction teamAudit14(){\n const found=rows.filter(r=\u003er.team).length,missing=rows.length-found;\n const groups=new Map();for(const r of rows){if(!r.team)continue;const k=norm(r.name);if(!groups.has(k))groups.set(k,new Set());groups.get(k).add(r.team)}\n const cross=[...groups].filter(([k,v])=\u003ev.size\u003e1);\n const seen=new Map();for(const r of rows){const key=r.teamEvidence+'|'+(r.team||'unknown');if(!seen.has(key))seen.set(key,r)}\n const samples=[...seen.values()].slice(0,7).map(r=\u003e'\u003cp style=\"border-top:1px solid #334155;padding-top:6px;font-size:.82em\"\u003e\u003cstrong\u003e'+esc(r.team||'UNKNOWN')+'\u003c/strong\u003e \u00b7 '+esc(r.teamEvidence||'No reason')+' \u00b7 '+esc(r.name)+' ('+esc(r.position||'?')+')\u003c/p\u003e').join('');\n\n const demo=document.implementation.createHTMLDocument('Team audit');demo.body.innerHTML='\u003ch3\u003eIndianapolis Colts\u003c/h3\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eExample\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003ch3\u003eMinnesota Vikings\u003c/h3\u003e\u003ctable\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eExample 2\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e';\n const pass=teamForTable14(demo.querySelectorAll('table')[0]).team==='Indianapolis Colts'&&teamForTable14(demo.querySelectorAll('table')[1]).team==='Minnesota Vikings'&&teamFromText14('Colts')==='Indianapolis Colts'&&teamFromText14('49ers')==='San Francisco 49ers'&&teamFromText14('random sports headline')==='';\n return '\u003csection style=\"padding:13px;border:1px solid #60a5fa;border-radius:12px;margin:12px 0;background:#101f32\"\u003e\u003ch3 style=\"margin:0 0 8px\"\u003e\ud83c\udf93 14th grade \u00b7 NFL text-adjacency retest\u003c/h3\u003e'+\n '\u003cp\u003e\u003cstrong\u003e'+found+'\u003c/strong\u003e rows with a nearby team text label (PROVISIONAL) \u00b7 \u003cstrong\u003e'+missing+'\u003c/strong\u003e rows with team unknown (out of '+rows.length+').\u003c/p\u003e'+\n '\u003cp style=\"color:'+(pass?'#5be29b':'#ff707a')+'\"\u003e'+(pass?'PASS':'FAIL')+' \u00b7 Isolated parser test: recognizes a nearby team heading and rejects unrelated text.\u003c/p\u003e'+\n '\u003cdetails style=\"margin:9px 0\"\u003e\u003csummary\u003eShow real-page team extraction diagnostics\u003c/summary\u003e'+samples+'\u003c/details\u003e'+\n (cross.length?'\u003cp style=\"color:#ffcf79\"\u003e\u26a0 '+cross.length+' player names appear under different extracted teams; manual identity review required.\u003c/p\u003e':'\u003cp\u003eNo cross-team same-name collisions identified in labeled rows. Unknown rows cannot be ruled out.\u003c/p\u003e')+\n '\u003cp style=\"color:#ffcf79\"\u003e\u003cstrong\u003eNOT YET VERIFIED:\u003c/strong\u003e Fantasy roster team IDs and unique NFL player IDs. Nearby headings are provisional context only, not a confirmed player-to-team match.\u003c/p\u003e'+\n '\u003cp style=\"font-size:.85em;color:#c4cbd8\"\u003eIf the NFL page does not provide a clear adjacent team heading, KuppCheck leaves the team unknown rather than guessing. No real roster or injury report is modified.\u003c/p\u003e\u003c/section\u003e';\n}\n\nfunction identityAudit13(){\n const grouped=new Map();\n for(const r of rows){const k=norm(r.name);if(!k)continue;const a=grouped.get(k)||[];a.push(r);grouped.set(k,a)}\n const rosterNames=[...new Set(Object.values(db).flat().map(p=\u003ep[0]).filter(Boolean))];\n const matched=rosterNames.filter(n=\u003egrouped.has(norm(n)));\n const repeated=matched.filter(n=\u003e(grouped.get(norm(n))||[]).length\u003e1);\n const nonUnique=new Map();for(const n of rosterNames){const k=norm(n);const a=nonUnique.get(k)||new Set();a.add(n);nonUnique.set(k,a)}\n const collisions=[...nonUnique].filter(([k,v])=\u003ev.size\u003e1);\n const sample=[{name:'TEST A',team:'ABC'},{name:'TEST A',team:'XYZ'}];\n const simulationPass=sample.length===2&&norm(sample[0].name)===norm(sample[1].name)&&sample[0].team!==sample[1].team;\n return '\u003csection style=\"padding:13px;border:1px solid #eab308;border-radius:12px;margin:12px 0;background:#201e16\"\u003e'+\n '\u003ch3 style=\"margin:0 0 8px\"\u003e\ud83c\udf93 13th grade \u00b7 Identity and source audit\u003c/h3\u003e'+\n '\u003cp style=\"margin:7px 0;color:#ffcf79\"\u003e\u003cstrong\u003ePLAYER IDENTITY: NOT VERIFIED\u003c/strong\u003e \u2014 matching uses names, not unique NFL player IDs or confirmed teams.\u003c/p\u003e'+\n '\u003cp style=\"margin:7px 0\"\u003e'+matched.length+' roster names matched \u00b7 '+repeated.length+' matched names have multiple NFL rows \u00b7 '+collisions.length+' roster name-normalization collisions.\u003c/p\u003e'+\n (repeated.length?'\u003cp style=\"margin:7px 0;color:#ffcf79\"\u003eMultiple rows require checking dates/teams: '+esc(repeated.slice(0,8).join(', '))+'\u003c/p\u003e':'\u003cp style=\"margin:7px 0\"\u003eNo multiple-row matches observed in this fetch; that \"\u003eThe self-test runs on isolated sample data every time this panel renders. It does not edit your roster, local saved reports, or NFL data. Passing it does not prove real-world NFL accuracy. Confirm important game statuses at the original NFL or team source before lineup decisions.\u003c/p\u003e'+\n '\u003cp style=\"margin:7px 0;font-weight:700\"\u003eGraduation standard: working controls + successful simulated tests + honest uncertainty labels. Real-source date and team verification remain future work.\u003c/p\u003e\u003c/section\u003e';\n}\n\n\nfunction identityMatch71(player,report){\n const fantasy=String(player[1]||'').trim().toUpperCase();\n const nfl=String(report.position||'').trim().toUpperCase();\n if(!fantasy||!nfl)return {ok:false,reason:'Missing fantasy or NFL position'};\n if(fantasy==='IDP'){\n   if(!/^(LB|ILB|OLB|MLB|CB|DB|S|FS|SS|DE|DT|DL|EDGE|NT)$/.test(nfl))\n     return {ok:false,reason:'NFL position is not a defensive position'};\n   return {ok:true,reason:'Defensive position compatible; player identity NOT verified'};\n }\n if(fantasy==='D/ST')return {ok:false,reason:'Team defense cannot match an individual player'};\n if(fantasy!==nfl)return {ok:false,reason:'Position mismatch: fantasy '+fantasy+', NFL '+nfl};\n return {ok:true,reason:'Name and position match; team/player ID NOT verified'};\n}\n\n// Manual NFL team mapping is kept separate from the fantasy roster and ESPN data.\n// It is a user assertion, NOT an official verified NFL player identifier.\nconst TEAM_KEY72='kuppcheck-v72-manual-player-teams';\nlet manualTeams72={};\ntry{const stored=JSON.parse(localStorage.getItem(TEAM_KEY72)||'{}');if(stored&&typeof stored==='object'&&!Array.isArray(stored))manualTeams72=stored}catch(e){}\nconst playerKey72=p=\u003enorm(p[0])+'|'+String(p[1]||'').trim().toUpperCase();\nfunction matchingRows71(player){\n const chosen=manualTeams72[playerKey72(player)]||'';\n if(!chosen)return [];\n return rows.filter(r=\u003enorm(r.name)===norm(player[0])&&
