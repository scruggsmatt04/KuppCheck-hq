de){\n  const sample=[\n   {name:'TEST PLAYER (SIMULATION)',injury:'Hamstring',practice:'Full Participation in Practice',designation:'Not designated'},\n   {name:'TEST PLAYER (SIMULATION)',injury:'Hamstring',practice:'Did Not Participate In Practice',designation:'Out'}\n  ];\n  relevant.unshift({key:'demo',name:'TEST PLAYER (SIMULATION)',fields:['practice','designation'],records:sample});\n }\n const fmt=r=>[r.designation||'No game designation',r.practice||'Practice unknown',r.injury||'Injury unspecified'].join(' \u00b7 ');\n return '<section style=\"padding:13px;border:1px solid #eab308;border-radius:10px;margin:12px 0;background:#241f15\">'+\n '<strong>\ud83d\udd75\ufe0f Tenth-grade conflict detector</strong>'+\n '<p style=\"margin:7px 0\">'+(rows.length?'<strong>'+relevant.length+'</strong> roster player(s) with differing NFL rows \u00b7 '+conflicts.length+' across all parsed NFL names'+(demoMode?' (includes 1 simulated conflict)':''):'Run an NFL refresh to check for conflicting rows.')+'</p>'+\n (relevant.length?relevant.slice(0,12).map(c=>'<div style=\"border-top:1px solid #675b37;padding-top:9px;margin-top:9px\"><strong style=\"color:#ffcf79\">\u26a0\ufe0f '+esc(c.name)+'</strong><small style=\"display:block\">Different fields: '+esc(c.fields.join(', '))+'</small>'+c.records.slice(0,4).map(r=>'<small style=\"display:block;color:#e7d8b4;margin-top:4px\">'+esc(fmt(r))+'</small>').join('')+'</div>').join(''):'<p style=\"font-size:.9em\">No conflicting duplicate rows found for your roster in this fetch. That does not verify accuracy or rule out conflicts on other sources.</p>')+\n '<p style=\"font-size:.85em;color:#ffcf79\">\u26a0\ufe0f Different rows may represent different teams, practices or report dates. Team and row-level dates are not verified, so conflicts require manual checking; no automatic availability verdict.</p></section>';\n}\n\n\nfunction seniorSelfTest(){\n const samples=[\n  {name:'TEST A',injury:'Hamstring',practice:'Full Participation in Practi ota Vikings'&&teamFromText14('Colts')==='Indianapolis Colts'&&teamFromText14('49ers')==='San Francisco 49ers'&&teamFromText14('random sports headline')==='';\n return '<section style=\"padding:13px;border:1px solid #60a5fa;border-radius:12px;margin:12px 0;background:#101f32\"><h3 style=\"margin:0 0 8px\">\ud83c\udf93 14th grade \u00b7 NFL text-adjacency retest</h3>'+\n '<p><strong>'+found+'</strong> rows with a nearby team text label (PROVISIONAL) \u00b7 <strong>'+missing+'</strong> rows with team unknown (out of '+rows.length+').</p>'+\n '<p style=\"color:'+(pass?'#5be29b':'#ff707a')+'\">'+(pass?'PASS':'FAIL')+' \u00b7 Isolated parser test: recognizes a nearby team heading and rejects unrelated text.</p>'+\n '<details style=\"margin:9px 0\"><summary>Show real-page team extraction diagnostics</summary>'+samples+'</details>'+\n (cross.length?'<p style=\"color:#ffcf79\">\u26a0 '+cross.length+' player names appear under different extracted teams; manual identity review required.</p>':'<p>No cross-team same-name collisions identified in labeled rows. Unknown rows cannot be ruled out.</p>')+\n '<p style=\"color:#ffcf79\"><strong>NOT YET VERIFIED:</strong> Fantasy roster team IDs and unique NFL player IDs. Nearby headings are provisional context only, not a confirmed player-to-team match.</p>'+\n '<p style=\"font-size:.85em;color:#c4cbd8\">If the NFL page does not provide a clear adjacent team heading, KuppCheck leaves the team unknown rather than guessing. No real roster or injury report is modified.</p></section>';\n}\n\nfunction identityAudit13(){\n const grouped=new Map();\n for(const r of rows){const k=norm(r.name);if(!k)continue;const a=grouped.get(k)||[];a.push(r);grouped.set(k,a)}\n const rosterNames=[...new Set(Object.values(db).flat().map(p=>p[0]).filter(Boolean))];\n const matched=rosterNames.filter(n=>grouped.has(norm(n)));\n const repeated=matched.filter(n=>(grouped.get(norm(n))||[]).length>1);\n const nonUnique=new Map();for(const n of rosterNames){const k=norm(n);const a=nonUnique.get(k)||new Set();a.add(n);nonUnique.set(k,a)}\n const collisions=[...nonUnique].filter(([k,v])=>v.size>1);\n const sample=[{name:'TEST A',team:'ABC'},{name:'TEST A',team:'XYZ'}];\n const simulationPass=sample.length===2&&norm(sample[0].name)===norm(sample[1].name)&&sample[0].team!==sample[1].team;\n return '<section style=\"padding:13px;border:1px solid #eab308;border-radius:12px;margin:12px 0;background:#201e16\">'+\n '<h3 style=\"margin:0 0 8px\">\ud83c\udf93 13th grade \u00b7 Identity and source audit</h3>'+\n '<p style=\"margin:7px 0;color:#ffcf79\"><strong>PLAYER IDENTITY: NOT VERIFIED</strong> \u2014 matching uses names, not unique NFL player IDs or confirmed teams.</p>'+\n '<p style=\"margin:7px 0\">'+matched.length+' roster names matched \u00b7 '+repeated.length+' matched names have multiple NFL rows \u00b7 '+collisions.length+' roster name-normalization collisions.</p>'+\n (repeated.length?'<p style=\"margin:7px 0;color:#ffcf79\">Multiple rows require checking dates/teams: '+esc(repeated.slice(0,8).join(', '))+'</p>':'<p style=\"margin:7px 0\">No multiple-row matches observed in this fetch; that does not verify identities.</p>')+\n '<p style=\"margin:7px 0;color:'+(simulationPass?'#5be29b':'#ff707a')+'\">'+(simulationPass?'PASS':'FAIL')+' \u00b7 Synthetic identity test: two players with the same name but different teams must NOT be treated as one verified identity.</p>'+\n '<p style=\"margin:7px 0\">Date labels near NFL tables: '+reportDates.length+'. <strong>Per-player publication dates: NOT VERIFIED.</strong></p>'+\n '<p style=\"font-size:.85em;color:#c4cbd8\">This audit does not guess missing teams or dates. A duplicate NFL row might reflect a separate practice day, not a second person. Always confirm team and date at the source before acting.</p></section>';\n}\n\nfunction seniorPanel(){\n const t=seniorSelfTest();\n const live=rows.length>0&&!error;\n const dateKnown=false; // Never infer row publication date from fetch time.\n return '<section style=\"padding:14px;border:1px solid #8dd8ae;border-radius:12px;margin:12px 0;background:#10241e\">'+\n '<h3 style=\"margin:0 0 8px\">\ud83c\udf93 Senior-year graduation audit</h3>'+\n '<p style=\"margin:7px 0;color:'+(t.passed?'#5be29b':'#ff707a')+';font-weight:700\">'+(t.passed?'PASS':'FAIL')+' \u00b7 Controlled detector test: contradictory reports flagged; identical reports and unrelated players not flagged</p>'+\n '<p style=\"margin:7px 0;color:'+(live?'#5be29b':'#ffcf79')+'\">'+(live?'\u2713 NFL report rows fetched in this session':'\u25cb Live NFL fetch not verified in this session')+'</p>'+\n '<p style=\"margin:7px 0;color:#ffcf79\">\u26a0 Individual player publication dates: '+(dateKnown?'Verified':'NOT VERIFIED')+'</p>'+\n '<p style=\"margin:7px 0;color:#ffcf79\">\u26a0 Team identity: name-only roster matching; not verified</p>'+\n '<p style=\"margin:7px 0;color:#c4cbd8;font-size:.86em\">The self-test runs on isolated sample data every time this panel renders. It does not edit your roster, local saved reports, or NFL data. Passing it does not prove real-world NFL accuracy. Confirm important game statuses at the original NFL or team source before lineup decisions.</p>'+\n '<p style=\"margin:7px 0;font-weight:700\">Graduation standard: working controls + successful simulated tests + honest uncertainty labels. Real-source date and team verification remain future work.</p></section>';\n}\n\n\nfunction identityMatch71(player,report){\n const fantasy=String(player[1]||'').trim().toUpperCase();\n const nfl=String(report.position||'').trim().toUpperCase();\n if(!fantasy||!nfl)return {ok:false,reason:'Missing fantasy or NFL position'};\n if(fantasy==='IDP'){\n   if(!/^(LB|ILB|OLB|MLB|CB|DB|S|FS|SS|DE|DT|DL|EDGE|NT)$/.test(nfl))\n     return {ok:false,reason:'NFL position is not a defensive position'};\n   return {ok:true,reason:'Defensive position compatible; player identity NOT verified'};\n }\n if(fantasy==='D/ST')return {ok:false,reason:'Team
