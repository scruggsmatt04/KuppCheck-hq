<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KuppCheck HQ V5.6 Fourth Grade</title></head><body style="font:18px system-ui;background:#0b1220;color:white;padding:20px"><p>Loading KuppCheck dashboard + fourth-grade NFL reader…</p><script>
(async()=>{try{const r=await fetch('./index-v5-nfl-test.html',{cache:'no-store'});if(!r.ok)throw Error('Dashboard HTTP '+r.status);let page=await r.text();const extension="\n\u003cscript>\n(function(){\nconst prevSources=v5Sources;\nlet rows=[],readState=\"Not loaded\",checked=\"\",error=\"\",prior=null;\nconst KEY54=\"kuppcheck-v54-nfl-snapshot\";\ntry {prior=JSON.parse(localStorage.getItem(KEY54)||\"null\")}catch(e){}\nconst norm=s=>String(s||\"\").toLowerCase().replace(/\\b(jr|sr|ii|iii|iv)\\b\\.?/g,\"\").replace(/[^a-z0-9]/g,\"\");\nconst valid=s=>s&&s.trim()&&s.trim()!==\"-\"&&s.trim().toLowerCase()!==\"unspecified\";\nfunction concern(r){\n const d=(r.designation||\"\").toLowerCase(),p=(r.practice||\"\").toLowerCase();\n if(/\\b(out|doubtful|questionable)\\b/.test(d))return {level:\"Game designation\",important:true};\n if(/did not participate|dnp|limited participation|limited practice/.test(p))return {level:\"Practice limitation\",important:true};\n if(/full participation|full practice/.test(p))return {level:\"Full practice\",important:false};\n return {level:\"Needs review\",important:false};\n}\nfunction priority(r){const d=(r.designation||'').toLowerCase(),p=(r.practice||'').toLowerCase();if(/\\bout\\b/.test(d))return 5;if(/\\bdoubtful\\b/.test(d))return 4;if(/\\bquestionable\\b/.test(d))return 3;if(/did not participate|dnp/.test(p))return 2;if(/limited participation|limited practice/.test(p))return 1;return 0;}\nfunction panel(){\n const names=[...new Set(Object.values(db).flat().map(p=>p[0]).filter(Boolean))];\n const matches=names.map(name=>({name,records:rows.filter(r=>norm(r.name)===norm(name))})).filter(x=>x.records.length);\n const flagged=matches.filter(x=>x.records.some(r=>concern(r).important));\n let changed=[];\n if(prior&&prior.records&&rows.length){\n  for(const x of matches)for(const r of x.records){\n   const key=norm(x.name)+\"|\"+r.team;\n   const old=prior.records[key];\n   if(old&&(old.designation!==r.designation||old.practice!==r.practice))\n     changed.push({name:x.name,from:old.practice+\" / \"+old.designation,to:r.practice+\" / \"+r.designation});\n  }\n }\n const ranked=[...matches].sort((a,b)=>Math.max(...b.records.map(priority))-Math.max(...a.records.map(priority)) || a.name.localeCompare(b.name));\n const list=ranked.map(x=>{\n  const unique=[...new Map(x.records.map(r=>[norm(r.name)+'|'+r.injury+'|'+r.practice+'|'+r.designation,r])).values()].sort((a,b)=>priority(b)-priority(a));\n  const descriptions=unique.map(r=>{\n   const c=concern(r),d=valid(r.designation)?r.designation.trim():'';\n   const injury=valid(r.injury)?r.injury.trim():'';\n   const clear=c.level==='Full practice'&&!d;\n   const tone=c.important?'#ff707a':clear?'#5be29b':'#c4cbd8';\n   const label=d?d.toUpperCase()+(injury?' — '+injury:''):c.important?'PRACTICE CONCERN'+(injury?' — '+injury:''):clear?'FULL PRACTICE — NO GAME DESIGNATION':'STATUS NEEDS REVIEW';\n   const practice=c.important&&valid(r.practice)?'\u003csmall style=\"display:block;color:#c4cbd8;margin-top:3px\">Practice: '+esc(r.practice)+'\u003c/small>':'';\n   return '\u003cdiv style=\"margin-top:8px\">\u003csmall style=\"display:block;color:'+tone+';font-weight:700\">'+esc(label)+'\u003c/small>'+practice+'\u003c/div>';\n  }).join('');\n  return '\u003cdiv class=\"player\">\u003cdiv class=\"details\">\u003cstrong>'+esc(x.name)+'\u003c/strong>'+descriptions+'\u003c/div>\u003c/div>';\n }).join('');\n return `\u003cdiv class=\"note\">\u003ch3>📚 V5.6 · Fourth-grade NFL intelligence\u003c/h3>\u003cp>Reports sorted by urgency: OUT, DOUBTFUL, QUESTIONABLE, missed practice, limited practice, then full practice. Red = reported concern; green = full practice with no game designation; gray = unclear. Green does not guarantee medical clearance. ESPN remains unchanged.\u003c/p>\u003cbutton id=\"read-nfl-54\" class=\"secondary\">Check NFL and classify my roster\u003c/button>\u003cp>\u003cstrong>${esc(readState)}\u003c/strong>${error?' · '+esc(error):''}\u003c/p>\u003cp>\u003csmall>Last successful check on this device: ${esc(checked||'Not yet')} · This is a retrieval timestamp, \u003cstrong>not\u003c/strong> the NFL report date or injury update time.\u003c/small>\u003c/p>\u003cp>\u003csmall>${checked?'⚠️ Check the original NFL report and its game date before making lineup decisions. This reader does not confirm report freshness.':'No NFL data checked in this session yet.'}\u003c/small>\u003c/p>\u003cp>\u003cstrong>${flagged.length}\u003c/strong> roster players with a game designation or practice limitation · \u003cstrong>${matches.length}\u003c/strong> roster names found · \u003cstrong>${rows.length}\u003c/strong> NFL report rows\u003c/p>${changed.length?`\u003ch4>Changes since last check on this device\u003c/h4>${changed.map(x=>`\u003cp>${esc(x.name)}: ${esc(x.from)} → ${esc(x.to)}\u003c/p>`).join(\"\")}`:'\u003cp>\u003csmall>No changes detected in comparable saved fields, or no earlier baseline. This does not confirm that NFL reports are unchanged.\u003c/small>\u003c/p>'}${list||'\u003cp>No roster matches yet. Press the check button.\u003c/p>'}\u003cp>\u003csmall>Practice participation is not a game designation. Duplicate names, missing teams, changing NFL page layout, and report dates need further verification before automated alerts.\u003c/small>\u003c/p>\u003ca href=\"https://www.nfl.com/injuries/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#a7caff\">Check original NFL reports\u003c/a>\u003c/div>`;\n}\nv5Sources=function(){return panel()+prevSources()};\nconst prevRender=render;\nrender=function(){prevRender();if(tab===\"injuries\"){const b=document.getElementById(\"read-nfl-54\");if(b)b.onclick=readNFL54}};\nasync function readNFL54(){\n readState=\"Reading official NFL page…\";error=\"\";render();\n try{\n  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);\n  let response;try{response=await fetch(\"https://www.nfl.com/injuries/\",{cache:\"no-store\",signal:controller.signal})}finally{clearTimeout(timer)}\n  if(!response.ok)throw Error(\"HTTP \"+response.status);\n  const doc=new DOMParser().parseFromString(await response.text(),\"text/html\"),next=[];\n  for(const tr of doc.querySelectorAll(\"tr\")){\n   const td=[...tr.querySelectorAll(\"td\")].map(c=>c.textContent.replace(/\\s+/g,\" \").trim());\n   if(td.length>=5&&td[0]&&/participat/i.test(td[3]))next.push({name:td[0],team:\"\",injury:td[2],practice:td[3],designation:td[4]});\n  }\n  if(!next.length)throw Error(\"No player rows parsed; NFL page layout may have changed\");\n  rows=next;checked=new Date().toLocaleString();readState=\"Parsed \"+rows.length+\" NFL rows (experimental)\";\n  // Retain previous snapshot for comparison during this session. Persist new baseline only after displaying comparison.\n  const newRecords={};\n  for(const r of rows)newRecords[norm(r.name)+\"|\"+r.team]={practice:r.practice,designation:r.designation};\n  const old=prior;\n  // Display change comparison before committing the new snapshot.\n  render();\n  prior={checked,records:newRecords};\n  try{localStorage.setItem(KEY54,JSON.stringify(prior))}catch(e){}\n  // Keep visible comparison until the next fetch; don't rerender here.\n  if(!old)readState+=\" · baseline saved\";\n }catch(e){error=String(e.message||e);readState=\"NFL read not verified\";rows=[];render()}\n}\nrender();\n})();\n\u003c/script>\n";page=page.replace(/<\/body>/i,extension+'</body>');if(!page.includes(extension))throw Error('Could not attach reader');document.open();document.write(page);document.close()}catch(e){document.body.textContent='Could not load dashboard: '+e.message+'. V4 remains untouched.'}})();
</script></body></html>
