sts practice participation, NOT a game availability decision.':'Not enough source detail for an availability conclusion.';\n return {tag,note,freshnessOk};\n}\nconst KEY54=\"kuppcheck-v54-nfl-snapshot\";\ntry {prior=JSON.parse(localStorage.getItem(KEY54)||\"null\")}catch(e){}\nif(prior&&prior.checked)previousChecked=prior.checked;\nconst norm=s=>String(s||\"\").toLowerCase().replace(/\\b(jr|sr|ii|iii|iv)\\b\\.?/g,\"\").replace(/[^a-z0-9]/g,\"\");\nconst valid=s=>s&&s.trim()&&s.trim()!==\"-\"&&s.trim().toLowerCase()!==\"unspecified\";\nfunction concern(r){\n const d=(r.designation||\"\").toLowerCase(),p=(r.practice||\"\").toLowerCase();\n if(/\\b(out|doubtful|questionable)\\b/.test(d))return {level:\"Game designation\",important:true};\n if(/did not participate|dnp|limited participation|limited practice/.test(p))return {level:\"Practice limitation\",important:true};\n if(/full participation|full practice/.test(p))return {level:\"Full practice\",important:false};\n return {level:\"Needs review\",important:false};\n}\nfunction priority(r){const d=(r.designation||'').toLowerCase(),p=(r.practice||'').toLowerCase();if(/\\bout\\b/.test(d))return 5;if(/\\bdoubtful\\b/.test(d))return 4;if(/\\bquestionable\\b/.test(d))return 3;if(/did not participate|dnp/.test(p))return 2;if(/limited participation|limited practice/.test(p))return 1;return 0;}\nfunction dateAudit(){\n const verified=reportDates.length;\n const age=checked?Math.max(0,Math.floor((Date.now()-Date.parse(checked))/60000)):null;\n const status=age===null?'NOT CHECKED':age>=120?'RECHECK ADVISED':'RECENTLY FETCHED';\n const color=age===null?'#c4cbd8':age>=120?'#ff707a':'#5be29b';\n const dateInfo=verified?'Found '+verified+' date label(s) near NFL tables (context only)':'No complete dates verified near NFL tables';\n return '<section style=\"padding:13px;border:1px solid #64748b;border-radius:10px;margin:12px 0;background:#101b2b\"><strong>\ud83d\udd0e Ninth-grade evidence check</strong><p style=\"margin:8px 0;color:'+color+';font-weight:700\">'+status+'</p><p style=\"margin:7px 0\">Device fetch: '+esc(checked?new Date(checked).toLocaleString():'Not yet fetched')+(age===null?'':' \u00b7 '+age+' minutes ago')+'</p><p style=\"margin:7px 0\">NFL publication date for individual players: <strong style=\"color:#ffcf79\">NOT VERIFIED</strong></p><p style=\"margin:7px 0\">'+esc(dateInfo)+'</p><p style=\"margin:7px 0;font-size:.88em\">EVIDENCE RULE: A retrieved NFL row is not proof of a current injury, a confirmed team match, or a player\u2019s game availability. Check the NFL source and team before lineup decisions.</p></section>';\n}\n\nfunction conflictAudit(){\n const byName=new Map();\n for(const r of rows){const key=norm(r.name)+'|'+String(r.position||'').toLowerCase()+'|'+String(r.team||'unknown');if(!norm(r.name))continue;if(!byName.has(key))byName.set(key,[]);byName.get(key).push(r)}\n const conflicts=[];\n for(const [key,rs] of byName){\n  if(rs.length<2)continue;\n  const normalized=(field)=>[...new Set(rs.map(r=>String(r[field]||'').trim().toLowerCase()).filter(Boolean))];\n  const differing=['designation','practice','injury'].filter(field=>normalized(field).length>1);\n  if(differing.length)conflicts.push({key,name:rs[0].name,fields:differing,records:rs});\n }\n return conflicts;\n}\nfunction playersForConflict71(c){return Object.values(db).flat().some(p=>p&&norm(p[0])===c.key&&c.records.some(r=>identityMatch71(p,r).ok));}\nfunction conflictPanel(){\n const conflicts=conflictAudit();\n const rosterKeys=new Set(Object.values(db).flat().map(p=>norm(p[0])).filter(Boolean));\n const relevant=conflicts.filter(c=>playersForConflict71(c));\n if(demoMode){\n  const sample=[\n   {name:'TEST PLAYER (SIMULATION)',injury:'Hamstring',practice:'Full Participation in Practice',designation:'Not designated'},\n   {name:'TEST PLAYER (SIMULATION)',injury:'Hamstring',practice:'Did Not Participate In Practice',designation:'Out'}\n  ];\n  relevant.unshift({key:'demo',name:'TEST PLAYER (SIMULATION)',fields:['practice','designation'],records:sample});\n }\n const fmt=r=>[r.designation||'No game designation',r.practice||'Practice unknown',r.injury||'Injury unspecified'].join(' \u00b7 ');\n return '<section style=\"padding:13px;border:1px solid #eab308;border-radius:10px;margin:12px 0;background:#241f15\">'+\n '<strong>\ud83d\udd75\ufe0f Tenth-grade conflict detector</strong>'+\n '<p style=\"margin:7px 0\">'+(rows.length?'<strong>'+relevant.length+'</strong> roster player(s) with differing NFL rows \u00b7 '+conflicts.length+' across all parsed NFL names'+(demoMode?' (includes 1 simulated conflict)':''):'Run an NFL refresh to check for conflicting rows.')+'</p>'+\n (relevant.length?relevant.slice(0,12).map(c=>'<div style=\"border-top:1px solid #675b37;padding-top:9px;margin-top:9px\"><strong style=\"color:#ffcf79\">\u26a0\ufe0f '+esc(c.name)+'</strong><small style=\"display:block\">Different fields: '+esc(c.fields.join(', '))+'</small>'+c.records.slice(0,4).map(r=>'<small style=\"display:block;color:#e7d8b4;margin-top:4px\">'+esc(fmt(r))+'</small>').join('')+'</div>').join(''):'<p style=\"font-size:.9em\">No conflicting duplicate rows found for your roster in this fetch. That does not verify accuracy or rule out conflicts on other sources.</p>')+\n '<p style=\"font-size:.85em;color:#ffcf79\">\u26a0\ufe0f Different rows may represent different teams, practices or report dates. Team and row-level dates are not verified, so conflicts require manual checking; no automatic availability verdict.</p></section>';\n}\n\n\nfunction seniorSelfTest(){\n const samples=[\n  {name:'TEST A',injury:'Hamstring',practice:'Full Participation in Practice',designation:'Not designated'},\n  {name:'TEST A',injury:'Hamstring',practice:'Did Not Participate In Practice',designation:'Out'},\n  {name:'TEST B',injury:'Knee',practice:'Limited Participation in Practice',designation:'Questionable'},\n  {name:'TEST B',injury:'Knee',practice:'Limited Participation in Practice',designation:'Questionable'},\n  {name:'TEST C',injury:'Ankle',practice:'Full Participation in Practice',designation:'Not designated'}\n ];\n const grouped=new Map();for(const r of samples){if(!grouped.has(r.name))grouped.set(r.name,[]);grouped.get(r.name).push(r)}\n const detected=[...grouped].filter(([_,rs])=>rs.length>1&&['injury','practice','designation'].some(k=>new Set(rs.map(r=>r[k])).size>1)).map(([name])=>name);\n return {passed:detected.length===1&&detected[0]==='TEST A',detected};\n}\n\n\n// Grade 14: conservative team-label extraction. A label is evidence of page context,\n// not proof of a player's NFL identity or of the fantasy roster team.\nconst NFL_TEAMS14=['Arizona Cardinals','Atlanta Falcons','Baltimore Ravens','Buffalo Bills','Carolina Panthers','Chicago Bears','Cincinnati Bengals','Cleveland Browns','Dallas Cowboys','Denver Broncos','Detroit Lions','Green Bay Packers','Houston Texans','Indianapolis Colts','Jacksonville Jaguars','Kansas City Chiefs','Las Vegas Raiders','Los Angeles Chargers','Los Angeles Rams','Miami Dolphins','Minnesota Vikings','New England Patriots','New Orleans Saints','New York Giants','New York Jets','Philadelphia Eagles','Pittsburgh Steelers','San Francisco 49ers','Seattle Seahawks','Tampa Bay Buccaneers','Tennessee Titans','Washington Commanders'];\n// Grade 14 remediation: NFL uses short labels (\"Colts\", \"49ers\") as well as full names.\nconst TEAM_LABELS14={\n 'cardinals':'Arizona Cardinals','falcons':'Atlanta Falcons','ravens':'Baltimore Ravens','bills':'Buffalo Bills','panthers':'Carolina Panthers','bears':'Chicago Bears','bengals':'Cincinnati Bengals','browns':'Cleveland Browns','cowboys':'Dallas Cowboys','broncos':'Denver Broncos','lions':'Detroit Lions','packers':'Green Bay Packers','texans':'Houston Texans','colts':'Indianapolis Colts','jaguars':'Jacksonville Jaguars','chiefs':'Kansas City Chiefs','raiders':'Las Vegas Raiders','chargers':'Los Angeles Chargers','rams':'Los Angeles Rams','dolphins':'Miami Dolphins','vikings':'Minnesota Vikings','patriots':'New England Patriots','saints':'New Orleans Saints','giants':'New York Giants','jets':'New York Jets','eagles':'Philadelphia Eagles','steelers':'Pittsburgh Steelers','49ers':'San Francisco 49ers','seahawks':'Seattle Seahawks','buccaneers':'Tampa Bay Buccaneers','titans':'Tennessee Titans','commanders':'Washington Commanders'\n};\nfunction teamFromText14(s){\n const t=String(s||'').replace(/\\s+/g,' ').trim().toLowerCase().replace(/[:\\-]+$/,'').trim();\n if(TEAM_LABELS14[t])return TEAM_LABELS14[t];\n return NFL_TEAMS14.find(name=>name.toLowerCase()===t)||'';\n}\nfunction teamForTable14(table){\n if(!table)return {team:'',reason:'Missing table',near:[]};\n const caption=table.querySelector('caption');\n if(caption){const t=teamFromText14(caption.textContent);if(t)return {team:t,reason:'Table caption',near:[caption.textContent.trim()]};}\n // Text-node traversal works even when NFL wraps headings in non-heading elements.\n // Never borrow a team name from an earlier player's table.\n const walker=table.ownerDocument.createTreeWalker(table.ownerDocument.body,NodeFilter.SHOW_TEXT);\n walker.currentNode=table;\n let inspected=0, snippets=[],candidates=[];\n while(inspected<32){\n  const node=walker.previousNode();\n  if(!node)break;\n  const parent=node.parentElement;\n  if(!parent)continue;\n  if(parent.closest('table'))break;\n  if(parent.closest('script,style,nav,footer,header'))continue;\n  const raw=node.textContent.replace(/\\s+/g,' ').trim();\n  if(!raw)continue;\n  inspected++;\n  if(snippets.length<10)snippets.push(raw.slice(0,55));\n  const team=teamFromText14(raw);\n  if(team)candidates.push({team,at:inspected});\n  // A team heading is normally directly above Player / Position / Injury labels.\n  // Beyond 12 visible text tokens, the ownership evidence is too weak.\n  if(inspected>=12)break;\n }\n const nearest=candidates[0];\n if(!nearest)return {team:'',reason:'No team label in 12 preceding text nodes',near:snippets};\n if(nearest.at>8)return {team:'',reason:'Team label too distant',near:snippets};\n // A nearby opponent label is not proof of table ownership; prefer a team label\n // followed only by table column headings.\n const intervening=snippets.slice(0,nearest.at-1).join(' ').toLowerCase();\n if(intervening && !/(player|position|injur|practice|game status)/.test(intervening))\n   return {team:'',reason:'Team label not next to table header',near:snippets};\n return {team:nearest.team,reason:'Adjacent table text (PROVISIONAL)',near:snippets};\n}\n\nfunction teamAudit14(){\n const found=rows.filter(r=>r.team).length,missing=rows.length-found;\n const groups=new Map();for(const r of rows){if(!r.team)continue;const k=norm(r.name);if(!groups.has(k))groups.set(k,new Set());groups.get(k).add(r.team)}\n const cross=[...groups].filter(([k,v])=>v.size>1);\n const seen=new Map();for(const r of rows){const key=r.teamEvidence+'|'+(r.team||'unknown');if(!seen.has(key))seen.set(key,r)}\n const samples=[...seen.values()].slice(0,7).map(r=>'<p style=\"border-top:1px solid #334155;padding-top:6px;font-size:.82em\"><strong>'+esc(r.team||'UNKNOWN')+'</strong> \u00b7 '+esc(r.teamEvidence||'No reason')+' \u00b7 '+esc(r.name)+' ('+esc(r.position||'?')+')</p>').join('');\n\n const demo=document.implementation.createHTMLDocument('Team audit');demo.body.innerHTML='<h3>Indianapolis Colts</h3><table><tbody><tr><td>Example</td></tr></tbody></table><h3>Minnesota Vikings</h3><table><tbody><tr><td>Example 2</td></tr></tbody></table>';\n const pass=teamForTable14(demo.querySelectorAll('table')[0]).team==='Indianapolis Colts'&&teamForTable14(demo.querySelectorAll('table')[1]).team==='Minnesota Vikings'&&teamFromText14('Colts')==='Indianapolis Colts'&&teamFromText14('49ers')==='San Francisco 49ers'&&teamFromText14('random sports headline')==='';\n return '<section style=\"padding:13px;border:1px solid #60a5fa;border-radius:12px;margin:12px 0;background:#101f32\"><h3 style=\"margin:0 0 8px\">\ud83c\udf93 14th grade \u00b7 NFL text-adjacency retest</h3>'+\n '<p><strong>'+found+'</strong> rows with a nearby team text label (PROVISIONAL) \u00b7 <strong>'+missing+'</strong> rows with team unknown (out of '+rows.length+').</p>'+\n '<p style=\"color:'+(pass?'#5be29b':'#ff707a')+'\">'+(pass?'PASS':'FAIL')+' \u00b7 Isolated parser test: recognizes a nearby team heading and rejects unrelated text.</p>'+\n '<details style=\"margin:9px 0\"><summary>Show real-page team extraction diagnostics</summary>'+samples+'</details>'+\n (cross.length?'<p style=\"color:#ffcf79\">\u26a0 '+cross.length+' player names appear under different extracted teams; manual identity review required.</p>':'<p>No cross-team same-name collisions identified in labeled rows. Unknown rows cannot be ruled out.</p>')+\n '<p style=\"color:#ffcf79\"><strong>NOT YET VERIFIED:</strong> Fantasy roster team IDs and unique NFL player IDs. Nearby headings are provisional context only, not a confirmed player-to-team match.</p>'+\n '<p style=\"font-size:.85em;color:#c4cbd8\">If the NFL page does not provide a clear adjacent team heading, KuppCheck leaves the team unknown rather than guessing. No real roster or injury report is modified.</p></section>';\n}\n\nfunction identityAudit13(){\n const grouped=new Map();\n for(const r of rows){const k=norm(r.name);if(!k)continue;const a=grouped.get(k)||[];a.push(r);grouped.set(k,a)}\n const rosterNames=[...new Set(Object.values(db).flat().map(p=>p[0]).filter(Boolean))];\n const matched=rosterNames.filter(n=>grouped.has(norm(n)));\n const repeated=matched.filter(n=>(grouped.get(norm(n))||[]).length>1);\n const nonUnique=new Map();for(const n of rosterNames){const k=norm(n);const a=nonUnique.get(k)||new Set();a.add(n);nonUnique.set(k,a)}\n const collisions=[...nonUnique].filter(([k,v])=>v.size>1);\n const sample=[{name:'TEST A',team:'ABC'},{name:'TEST A',team:'XYZ'}];\n const simulationPass=sample.length===2&&norm(sample[0].name)===norm(sample[1].name)&&sample[0].team!==sample[1].team;\n return '<section style=\"padding:13px;border:1px solid #eab308;border-radius:12px;margin:12px 0;background:#201e16\">'+\n '<h3 style=\"margin:0 0 8px\">\ud83c\udf93 13th grade \u00b7 Identity and source audit</h3>'+\n '<p style=\"margin:7px 0;color:#ffcf79\"><strong>PLAYER IDENTITY: NOT VERIFIED</strong> \u2014 matching uses names, not unique NFL player IDs or confirmed teams.</p>'+\n '<p style=\"margin:7px 0\">'+matched.length+' roster names matched \u00b7 '+repeated.length+' matched names have multiple NFL rows \u00b7 '+collisions.length+' roster name-normalization collisions.</p>'+\n (repeated.length?'<p style=\"margin:7px 0;color:#ffcf79\">Multiple rows require checking dates/teams: '+esc(repeated.slice(0,8).join(', '))+'</p>':'<p style=\"margin:7px 0\">No multiple-row matches observed in this fetch; that does not verify identities.</p>')+\n '<p style=\"margin:7px 0;color:'+(simulationPass?'#5be29b':'#ff707a')+'\">'+(simulationPass?'PASS':'FAIL')+' \u00b7 Synthetic identity test: two players with the same name but different teams must NOT be treated as one verified identity.</p>'+\n '<p style=\"margin:7px 0\">Date labels near NFL tables: '+reportDates.length+'. <strong>Per-player publication dates: NOT VERIFIED.</strong></p>'+\n '<p style=\"font-size:.85em;color:#c4cbd8\">This audit does not guess missing teams or dates. A duplicate NFL row might reflect a separate practice day, not a second person. Always confirm team and date at the source before acting.</p></section>';\n}\n\nfunction seniorPanel(){\n const t=seniorSelfTest();\n const live=rows.length>0&&!error;\n const dateKnown=false; // Never infer row publication date from fetch time.\n return '<section style=\"padding:14px;border:1px solid #8dd8ae;border-radius:12px;margin:12px 0;background:#10241e\">'+\n '<h3 style=\"margin:0 0 8px\">\ud83c\udf93 Senior-year graduation audit</h3>'+\n '<p style=\"margin:7px 0;color:'+(t.passed?'#5be29b':'#ff707a')+';font-weight:700\">'+(t.passed?'PASS':'FAIL')+' \u00b7 Controlled detector test: contradictory reports flagged; identical reports and unrelated players not flagged</p>'+\n '<p style=\"margin:7px 0;color:'+(live?'#5be29b':'#ffcf79')+'\">'+(live?'\u2713 NFL report rows fetched in this session':'\u25cb Live NFL fetch not verified in this session')+'</p>'+\n '<p style=\"margin:7px 0;color:#ffcf79\">\u26a0 Individual player publication dates: '+(dateKnown?'Verified':'NOT VERIFIED')+'</p>'+\n '<p style=\"margin:7px 0;color:#ffcf79\">\u26a0 Team identity: name-only roster matching; not verified</p>'+\n '<p style=\"margin:7px 0;color:#c4cbd8;font-size:.86em\">The self-test runs on isolated sample data every time this panel renders. It does not edit your roster, local saved reports, or NFL data. Passing it does not prove real-world NFL accuracy. Confirm important game statuses at the original NFL or team source before lineup decisions.</p>'+\n '<p style=\"margin:7px 0;font-weight:700\">Graduation standard: working controls + successful simulated tests + honest uncertainty labels. Real-source date and team verification remain future work.</p></section>';\n}\n\n\nfunction identityMatch71(player,report){\n const fantasy=String(player[1]||'').trim().toUpperCase();\n const nfl=String(report.position||'').trim().toUpperCase();\n if(!fantasy||!nfl)return {ok:false,reason:'Missing fantasy or NFL position'};\n if(fantasy==='IDP'){\n   if(!/^(LB|ILB|OLB|MLB|CB|DB|S|FS|SS|DE|DT|DL|EDGE|NT)$/.test(nfl))\n     return {ok:false,reason:'NFL position is not a defensive position'};\n   return {ok:true,reason:'Defensive position compatible; player identity NOT verified'};\n }\n if(fantasy==='D/ST')return {ok:false,reason:'Team defense cannot match an individual player'};\n if(fantasy!==nfl)return {ok:false,reason:'Position mismatch: fantasy '+fantasy+', NFL '+nfl};\n return {ok:true,reason:'Name and position match; team/player ID NOT verified'};\n}\n\n// Manual NFL team mapping is kept separate from the fantasy roster and ESPN data.\n// It is a user assertion, NOT an official verified NFL player identifier.\nconst TEAM_KEY72='kuppcheck-v72-manual-player-teams';\nlet manualTeams72={};\ntry{const stored=JSON.parse(localStorage.getItem(TEAM_KEY72)||'{}');if(stored&&typeof stored==='object'&&!Array.isArray(stored))manualTeams72=stored}catch(e){}\nconst playerKey72=p=>norm(p[0])+'|'+String(p[1]||'').trim().toUpperCase();\n\n// ESPN roster cross-check is a separate source from the NFL injury HTML.\n// ESPN may block CORS or return stale roster data; fail closed.\nconst ESPN_TEAM_IDS73=['ari','atl','bal','buf','car','chi','cin','cle','dal','den','det','gb','hou','ind','jax','kc','lv','lac','lar','mia','min','ne','no','nyg','nyj','phi','pit','sf','sea','tb','ten','wsh'];\nconst ESPN_CACHE73='kuppcheck-v73-espn-roster-evidence';\nlet espnState73='Not checked',espnEvidence73={},espnChecked73='';\ntry{const c=JSON.parse(localStorage.getItem(ESPN_CACHE73)||'{}');if(c&&Date.now()-Date.parse(c.checked)<21600000){espnEvidence73=c.evidence||{};espnChecked73=c.checked;espnState73='Cached ESPN rosters'}}catch(e){}\nfunction extractRoster73(data,teamName){\n const out=[];\n const visit=(node,depth)=>{\n   if(!node||depth>8)return;\n   if(Array.isArray(node)){node.forEach(x=>visit(x,depth+1));return}\n   if(typeof node!=='object')return;\n   const a=node.athlete&&typeof node.athlete==='object'?node.athlete:node;\n   if((a.id||a.uid)&&typeof a.displayName==='string'&&(a.position||a.defaultPosition)){\n     const pos=a.position||a.defaultPosition;\n     out.push({id:String(a.id||a.uid),name:a.displayName,position:String(pos.abbreviation||pos.name||''),team:teamName});\n   }\n   for(const [k,v] of Object.entries(node)){\n     if(k==='athlete'&&a!==node)continue;\n     if(k==='links'||k==='statistics'||k==='headshot'||k==='events')continue;\n     if(v&&typeof v==='object')visit(v,depth+1);\n   }\n };\n visit(data.athletes||data.roster||[],0);\n return out;\n}\nasync function fetchEspn73(){\n if(espnState73==='Checking ESPN rosters\u2026')return;\n espnState73='Checking ESPN rosters\u2026';render();\n try{\n   const evidence={};let next=0,successful=0,failed=0;\n   async function worker(){\n     while(next<ESPN_TEAM_IDS73.length){\n       const id=ESPN_TEAM_IDS73[next++];\n       try{\n         const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);\n         let response;\n         try{response=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/'+id+'/roster',{mode:'cors',cache:'no-store',signal:ctl.signal})}\n         finally{clearTimeout(timer)}\n         if(!response.ok)throw Error('HTTP '+response.status);\n         const data=await response.json();\n         const teamName=String(data.team?.displayName||data.team?.name||'');\n         if(!NFL_TEAMS14.includes(teamName))throw Error('Unrecognized team '+teamName);\n         const athletes=extractRoster73(data,teamName);\n         if(athletes.length<15)throw Error('Incomplete roster '+athletes.length);\n         successful++;\n         for(const a of athletes){\n           const key=norm(a.name);\n           (evidence[key]||(evidence[key]=[])).push(a);\n         }\n       }catch(e){failed++}\n     }\n   }\n   await Promise.all(Array.from({length:4},worker));\n   // A partial league lookup must not be presented as a complete identity check.\n   if(successful!==32)throw Error('Only '+successful+'/32 ESPN teams loaded; no automatic team matches accepted. Retry later.');\n   espnEvidence73=evidence;espnChecked73=new Date().toISOString();espnState73='ESPN roster lookup completed: 32/32 teams';\n   try{localStorage.setItem(ESPN_CACHE73,JSON.stringify({checked:espnChecked73,evidence}))}catch(e){}\n }catch(e){espnEvidence73={};espnState73='Lookup unavailable: '+String(e.message||e)}\n render();\n}\nfunction autoEvidence73(p){\n const entries=espnEvidence73[norm(p[0])]||[];\n const compatible=entries.filter(a=>identityMatch71(p,{position:a.position}).ok);\n const distinct=[...new Map(compatible.map(a=>[a.id,a])).valu
